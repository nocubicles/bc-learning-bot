    validation_questions:
      - question: "Which vendor has the longest payment terms and what are they?"
        expected_answer: "Sakura Electronics Co., Ltd. (V20100) with 45 DAYS payment terms"
        hints:
          - "Compare the Payment Terms Code across the three vendors"
      - question: "Do any of the vendors have different posting groups from each other?"
        expected_answer: "No. All three vendors use the same posting groups: EXPORT (Gen. Bus.), EXPORT (VAT Bus.), and FOREIGN (Vendor). This is because they are all non-EU Asian companies."
        hints:
          - "All vendors are from Asia — what does that mean for their posting groups?"

  - id: verify_vendor_list
    title: "Verify the complete vendor list"
    instructions: |
      Open the Vendor List (Page 27) and verify all 3 vendors are present.

      You should see:

        No.      Name                            Country   Gen. Bus. Group  Currency
        -------  ------------------------------  --------  ---------------  --------
        V20000   Shenzhen TechParts Co., Ltd.    CN        EXPORT           USD
        V20100   Sakura Electronics Co., Ltd.    JP        EXPORT           USD
        V20200   Seoul Components Corp.          KR        EXPORT           USD

      Open each vendor card and verify:
        1. Address and contact details are correct
        2. Posting groups are all EXPORT / FOREIGN
        3. Currency is USD for all vendors
        4. Payment terms are correct (30, 45, 30 days)

      Compare the vendor setup to the customer setup:
        - Customers span three posting groups (DOMESTIC, EU, EXPORT)
        - Vendors are all EXPORT (since all suppliers are Asian)
        - Customers use various currencies (DKK, SEK, NOK, EUR)
        - Vendors all use USD
    config_data: {}
    validation_questions:
      - question: "How many vendors are now in the system?"
        expected_answer: "3"
        hints:
          - "Count the rows in the Vendor List"
      - question: "What is the key difference in posting group diversity between customers and vendors?"
        expected_answer: "Customers use three different Gen. Bus. Posting Groups (DOMESTIC, EU, EXPORT) based on their country, while all vendors use the same group (EXPORT) because they are all non-EU Asian companies."
        hints:
          - "Think about the geographic spread of customers vs vendors"

  - id: understand_currency_impact
    title: "Understand the impact of foreign currency on vendor transactions"
    instructions: |
      This is a conceptual task — no data entry required.

      When Nordic Traders creates a purchase order to Shenzhen TechParts:
        1. The order amount is in USD (the vendor's currency)
        2. BC converts USD to DKK using the exchange rate for posting
        3. The payable (what we owe) is tracked in both USD and DKK
        4. When we pay, any exchange rate difference creates a gain or loss

      Example:
        - Purchase order: 1,000 USD at rate 6.85 = 6,850 DKK
        - Payment 30 days later: rate has changed to 6.90
        - Payment in DKK: 1,000 x 6.90 = 6,900 DKK
        - Exchange rate loss: 50 DKK (we paid more DKK than expected)

      This exchange rate gain/loss posts to the G/L accounts configured in
      the Currency card (typically account 8300 or similar).

      Understanding this is important because Nordic Traders buys in USD
      but sells in DKK, SEK, NOK, and EUR — so exchange rate risk is
      a constant factor in the business.
    config_data: {}
    validation_questions:
      - question: "If Nordic Traders buys goods for 10,000 USD at rate 6.85 and pays when the rate is 6.92, is there an exchange rate gain or loss?"
        expected_answer: "Exchange rate loss of 700 DKK. At purchase: 10,000 x 6.85 = 68,500 DKK. At payment: 10,000 x 6.92 = 69,200 DKK. The loss is 69,200 - 68,500 = 700 DKK."
        hints:
          - "If DKK weakens (rate goes up), you need more DKK to pay the same USD amount"
          - "Loss means you paid more than originally expected"
      - question: "Why is exchange rate management especially important for Nordic Traders?"
        expected_answer: "Because the company buys all goods in USD from Asian vendors but sells in multiple Nordic currencies (DKK, SEK, NOK, EUR). Exchange rate fluctuations affect both the purchase cost and sales revenue, creating double exposure."
        hints:
          - "Think about the currencies on both the buying and selling side"

validation_questions:
  - question: "How many vendors did you create and what do they all have in common?"
    expected_answer: "3 vendors, all from Asia (China, Japan, South Korea), all using EXPORT posting groups, all trading in USD"
    hints: []
  - question: "What is the Vendor Posting Group and what G/L account does FOREIGN map to?"
    expected_answer: "The Vendor Posting Group determines which G/L account is used for trade payables. FOREIGN maps to account 2110 (Trade Payables)."
    hints: []
  - question: "Why were currencies set up in this lesson rather than the customer lesson?"
    expected_answer: "Currencies could have been set up earlier, but they are most relevant when creating vendors because all vendors trade in USD. The customer lesson could have set up SEK, NOK, and EUR, but grouping all currency setup here makes the lesson flow better."
    hints: []

agent_context: |
  This lesson mirrors the customer setup but focuses on vendors. Students should
  notice the symmetry between customer and vendor cards.

  Key teaching points:
  - Vendor card structure is very similar to customer card
  - All three vendors use EXPORT because they are all non-EU Asian companies
  - USD is the standard international trade currency for electronics
  - Currency exchange rates are entered as a ratio (100 foreign = X DKK)
  - Exchange rate gains/losses are a real business concern for importers
  - Payment Terms are shared between customers and vendors (already created)
  - Vendor Posting Group is analogous to Customer Posting Group

  Common mistakes:
  - Forgetting to set up exchange rates after creating the currency codes
  - Using the wrong exchange rate format (entering 6.85 instead of 685.00 for 100 USD)
  - Setting vendor Gen. Bus. Posting Group to DOMESTIC instead of EXPORT
  - Trying to enter a VAT Registration No. for non-EU vendors (not needed)
  - Confusing the Vendor Posting Group with the Gen. Bus. Posting Group
  - Not creating the 45 DAYS payment term before assigning it to Sakura Electronics

  The currency exchange rate concept may be new to some students.
  Use the example in the last task to make it concrete. Emphasize that
  Nordic Traders faces exchange rate risk on both sides (buying in USD,
  selling in SEK/NOK/EUR).

estimated_duration: "40 minutes"
