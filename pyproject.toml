[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-bot"
version = "0.1.0"
description = "BC Learning Bot — A senior consultant chatbot for teaching Business Central implementation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bcbot = "learning_bot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_bot"]
