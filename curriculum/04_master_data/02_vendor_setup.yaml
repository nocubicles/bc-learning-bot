id: vendor_setup
title: "Setting Up Vendors"
objectives:
  - "Understand the vendor card and how it mirrors the customer card"
  - "Configure currencies for foreign trade (USD, SEK, NOK, EUR)"
  - "Create all three Asian vendors with correct posting groups and currency"
  - "Understand why all vendors use EXPORT posting groups and USD currency"
prerequisites:
  - "customer_setup"
tasks:
  - id: setup_currencies
    title: "Set up currencies for foreign trade"
    instructions: |
      Before creating vendors who trade in foreign currencies, we need to set up
      the currency codes in Business Central.

      Search for "Currencies" (Page 5) using Alt+Q.

      Create or verify the following currencies:

        Code   Description          ISO Code  ISO Numeric Code
        -----  -------------------  --------  ----------------
        USD    US Dollar            USD       840
        SEK    Swedish Krona        SEK       752
        NOK    Norwegian Krone      NOK       578
        EUR    Euro                 EUR       978

      For each currency, you also need to set up an exchange rate.
      Click on the currency line, then choose "Exchange Rates" from the actions.

      On the Currency Exchange Rates page (Page 483), enter a starting rate:

        Currency   Starting Date   Exchange Rate Amount  Relational Exch. Rate Amt
        ---------  --------------  --------------------  -------------------------
        USD        01/01/2025      100                   685.00
        SEK        01/01/2025      100                   63.50
        NOK        01/01/2025      100                   64.00
        EUR        01/01/2025      100                   745.00

      This means: 100 USD = 685.00 DKK, 100 SEK = 63.50 DKK, etc.

      These are approximate rates. In production you would update exchange rates
      regularly, but for learning purposes these starting rates are sufficient.

      Note: DKK is the local currency (LCY) and does not appear in the
      Currencies list. It is defined in General Ledger Setup.
    config_data:
      currencies:
        - { code: "USD", description: "US Dollar", iso_code: "USD", exchange_rate: 685.00 }
        - { code: "SEK", description: "Swedish Krona", iso_code: "SEK", exchange_rate: 63.50 }
        - { code: "NOK", description: "Norwegian Krone", iso_code: "NOK", exchange_rate: 64.00 }
        - { code: "EUR", description: "Euro", iso_code: "EUR", exchange_rate: 745.00 }
    validation_questions:
      - question: "How many currencies did you set up?"
        expected_answer: "4 (USD, SEK, NOK, EUR)"
        hints:
          - "DKK is the local currency and is not in the list"
      - question: "What does the exchange rate 100 USD = 685 DKK mean in practical terms?"
        expected_answer: "1 USD is worth 6.85 DKK. BC uses a ratio format where the Exchange Rate Amount (100) of the foreign currency equals the Relational Exchange Rate Amount (685) in DKK."
        hints:
          - "Divide 685 by 100 to get the rate for 1 unit"

  - id: create_first_vendor
    title: "Create the first vendor — Shenzhen TechParts Co., Ltd."
    instructions: |
      Search for "Vendors" (Page 27) to open the Vendor List.

      Click "New" to create a new vendor card (Page 26).

      Fill in the following fields:

        General FastTab:
          No.:                   V20000
          Name:                  Shenzhen TechParts Co., Ltd.

        Address & Contact FastTab:
          Address:               Building 12, Hi-Tech Park
          Address 2:             Nanshan District
          City:                  Shenzhen
          Post Code:             518057
          Country/Region Code:   CN
          Phone No.:             +86 755 8632 1234
          E-Mail:                sales@sztechparts.cn

        Invoicing FastTab:
          Gen. Bus. Posting Group:  EXPORT
          VAT Bus. Posting Group:   EXPORT
          Vendor Posting Group:     FOREIGN
          Currency Code:            USD

        Payments FastTab:
          Payment Terms Code:    30 DAYS

      Important notes about this vendor:
        - China is outside the EU, so the posting group is EXPORT
        - All Asian vendors trade in USD (the standard currency for international electronics trade)
        - Vendor Posting Group FOREIGN maps payables to the correct G/L account (2110)
        - No VAT Registration No. is needed for non-EU vendors
    config_data:
      vendor:
        number: "V20000"
        name: "Shenzhen TechParts Co., Ltd."
        address: "Building 12, Hi-Tech Park"
        address_2: "Nanshan District"
        city: "Shenzhen"
        post_code: "518057"
        country: "CN"
        phone: "+86 755 8632 1234"
        email: "sales@sztechparts.cn"
        gen_bus_posting_group: "EXPORT"
        vat_bus_posting_group: "EXPORT"
        vendor_posting_group: "FOREIGN"
        currency_code: "USD"
        payment_terms: "30 DAYS"
    validation_questions:
      - question: "Why is the Gen. Bus. Posting Group set to EXPORT for this vendor?"
        expected_answer: "Because China is outside the European Union. All non-EU countries use the EXPORT posting group, which ensures zero VAT on purchases and correct G/L account mapping."
        hints:
          - "China is in Asia — is it in the EU?"
      - question: "Why do all Asian electronics vendors trade in USD instead of their local currency?"
        expected_answer: "USD is the standard international trade currency for electronics and many global commodities. Trading in USD simplifies pricing and avoids dealing with multiple exotic currencies (CNY, JPY, KRW)."
        hints:
          - "Think about what currency is commonly used in international trade"

