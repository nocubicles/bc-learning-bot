    config_data:
      vendors:
        - number: "V20100"
          name: "Sakura Electronics Co., Ltd."
          address: "3-14-1 Akihabara"
          city: "Tokyo"
          post_code: "101-0021"
          country: "JP"
          phone: "+81 3 5678 1234"
          email: "export@sakura-elec.co.jp"
          gen_bus_posting_group: "EXPORT"
          vat_bus_posting_group: "EXPORT"
          vendor_posting_group: "FOREIGN"
          currency_code: "USD"
          payment_terms: "45 DAYS"
        - number: "V20200"
          name: "Seoul Components Corp."
          address: "256 Digital-ro, Guro-gu"
          city: "Seoul"
          post_code: "08381"
          country: "KR"
          phone: "+82 2 1234 5678"
          email: "trade@seoulcomponents.kr"
          gen_bus_posting_group: "EXPORT"
          vat_bus_posting_group: "EXPORT"
          vendor_posting_group: "FOREIGN"
