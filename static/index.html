<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BC Learning Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }

    /* Markdown content styling */
    .markdown-content h1 { font-size: 1.5em; font-weight: 700; margin: 0.5em 0; }
    .markdown-content h2 { font-size: 1.25em; font-weight: 600; margin: 0.5em 0; }
    .markdown-content h3 { font-size: 1.1em; font-weight: 600; margin: 0.4em 0; }
    .markdown-content p { margin: 0.4em 0; }
    .markdown-content ul, .markdown-content ol { margin: 0.4em 0; padding-left: 1.5em; }
    .markdown-content li { margin: 0.2em 0; }
    .markdown-content code { background: #1e293b; padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; }
    .markdown-content pre { background: #1e293b; padding: 0.75em; border-radius: 6px; overflow-x: auto; margin: 0.5em 0; }
    .markdown-content pre code { background: none; padding: 0; }
    .markdown-content table { border-collapse: collapse; width: 100%; margin: 0.5em 0; }
    .markdown-content th, .markdown-content td { border: 1px solid #374151; padding: 0.4em 0.75em; text-align: left; }
    .markdown-content th { background: #1e293b; font-weight: 600; }
    .markdown-content blockquote { border-left: 3px solid #3b82f6; padding-left: 0.75em; margin: 0.5em 0; color: #9ca3af; }
    .markdown-content a { color: #60a5fa; text-decoration: underline; }
    .markdown-content .mermaid { display: flex; justify-content: center; margin: 0.75em 0; max-width: 100%; overflow-x: auto; }
    .markdown-content .mermaid svg { max-width: 100%; height: auto; }

    /* Typing indicator */
    .typing-dot { animation: typingBounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Command palette */
    #command-palette {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      margin-bottom: 4px;
      max-height: 280px;
      overflow-y: auto;
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 0.5rem;
      z-index: 50;
    }
    #command-palette .cmd-item {
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      display: flex;
      gap: 0.75rem;
      align-items: baseline;
    }
    #command-palette .cmd-item.active {
      background: #4b5563;
    }
    #command-palette .cmd-item:hover {
      background: #374151;
    }
    #command-palette .cmd-name {
      color: #67e8f9;
      font-family: monospace;
      white-space: nowrap;
    }
    #command-palette .cmd-desc {
      color: #9ca3af;
      font-size: 0.85em;
    }

    /* Sidebar status icons */
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-not_started { background: #6b7280; }
    .status-in_progress { background: #eab308; }
    .status-validated { background: #3b82f6; }
    .status-completed { background: #22c55e; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

  <!-- SESSION START SCREEN -->
  <div id="login-screen" class="flex items-center justify-center h-full">
    <div class="bg-gray-800 rounded-xl shadow-2xl p-8 w-full max-w-md mx-4">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-blue-400 mb-2">BC Learning Bot</h1>
        <p class="text-gray-400">Learn Business Central implementation with Rainer, your senior consultant.</p>
      </div>
      <div class="space-y-4">
        <div>
          <label for="name-input" class="block text-sm font-medium text-gray-300 mb-1">Your name</label>
          <input
            id="name-input"
            type="text"
            placeholder="Enter your name..."
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            autofocus
          />
        </div>
        <button
          id="start-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Start Learning
        </button>
        <p id="login-error" class="text-red-400 text-sm hidden"></p>
      </div>
    </div>
  </div>

  <!-- CHAT SCREEN (hidden initially) -->
  <div id="chat-screen" class="hidden h-full flex flex-col">
    <!-- Top bar -->
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <button id="sidebar-toggle" class="lg:hidden text-gray-400 hover:text-white p-1">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="text-lg font-semibold text-blue-400">BC Learning Bot</h1>
      </div>
      <div class="flex items-center gap-2 text-sm text-gray-400">
        <span id="student-label"></span>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <!-- SIDEBAR -->
      <aside id="sidebar" class="hidden lg:flex flex-col w-80 bg-gray-800 border-r border-gray-700 overflow-y-auto shrink-0">
        <!-- Progress bar -->
        <div class="p-4 border-b border-gray-700">
          <div class="flex justify-between text-sm mb-1">
            <span class="text-gray-400">Progress</span>
            <span id="progress-pct" class="text-blue-400 font-medium">0%</span>
          </div>
          <div class="w-full bg-gray-700 rounded-full h-2">
            <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
          <p id="progress-detail" class="text-xs text-gray-500 mt-1">0 / 0 lessons</p>
        </div>

        <!-- Curriculum tree -->
        <div class="p-4 flex-1 overflow-y-auto">
          <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-3">Curriculum</h2>
          <div id="curriculum-tree" class="space-y-3 text-sm"></div>
        </div>
      </aside>

      <!-- MAIN CHAT AREA -->
      <main class="flex-1 flex flex-col min-w-0">
        <!-- Messages -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

        <!-- Input area -->
        <div class="border-t border-gray-700 p-4 bg-gray-800 shrink-0">
          <form id="chat-form" class="flex gap-3 relative">
            <div id="command-palette" class="hidden"></div>
            <input
              id="chat-input"
              type="text"
              placeholder="Type a message or /command..."
              class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              autocomplete="off"
            />
            <button
              type="submit"
              id="send-btn"
              class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Send
            </button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script>
    // ---------- State ----------
    let sessionId = null;

    // ---------- DOM refs ----------
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const nameInput = document.getElementById('name-input');
    const startBtn = document.getElementById('start-btn');
    const loginError = document.getElementById('login-error');
    const studentLabel = document.getElementById('student-label');
    const messagesEl = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebar = document.getElementById('sidebar');
    const progressPct = document.getElementById('progress-pct');
    const progressBar = document.getElementById('progress-bar');
    const progressDetail = document.getElementById('progress-detail');
    const curriculumTree = document.getElementById('curriculum-tree');

    // ---------- Mermaid init ----------
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    // ---------- Markdown renderer ----------
    marked.setOptions({ breaks: true, gfm: true });

    function renderMarkdown(text) {
      return DOMPurify.sanitize(marked.parse(text || ''));
    }

    function renderMermaidBlocks(container) {
      const codeBlocks = container.querySelectorAll('code.language-mermaid');
      if (!codeBlocks.length) return;
      codeBlocks.forEach(code => {
        const pre = code.parentElement;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        pre.replaceWith(div);
      });
      mermaid.run({ nodes: container.querySelectorAll('.mermaid') });
    }

    // ---------- Message rendering ----------
    function addMessage(type, content, extra) {
      const wrapper = document.createElement('div');

      if (type === 'assistant') {
        wrapper.className = 'flex gap-3';
        wrapper.innerHTML = `
          <div class="shrink-0 w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-sm font-bold">R</div>
          <div class="bg-gray-800 rounded-xl rounded-tl-sm px-4 py-3 max-w-3xl markdown-content">${renderMarkdown(content)}</div>
        `;
        renderMermaidBlocks(wrapper);
      } else if (type === 'user') {
        wrapper.className = 'flex justify-end';
        wrapper.innerHTML = `
          <div class="bg-blue-600 rounded-xl rounded-tr-sm px-4 py-3 max-w-3xl">${escapeHtml(content)}</div>
        `;
      } else if (type === 'info') {
        wrapper.className = 'flex justify-center';
        wrapper.innerHTML = `<div class="bg-gray-700 text-blue-300 rounded-lg px-4 py-2 text-sm max-w-2xl"><span class="mr-1">&#8505;</span>${escapeHtml(content)}</div>`;
      } else if (type === 'success') {
        wrapper.className = 'flex justify-center';
        wrapper.innerHTML = `<div class="bg-green-900/40 text-green-300 border border-green-800 rounded-lg px-4 py-2 text-sm max-w-2xl"><span class="mr-1">&#10003;</span>${escapeHtml(content)}</div>`;
      } else if (type === 'error') {
        wrapper.className = 'flex justify-center';
        wrapper.innerHTML = `<div class="bg-red-900/40 text-red-300 border border-red-800 rounded-lg px-4 py-2 text-sm max-w-2xl"><span class="mr-1">&#10007;</span>${escapeHtml(content)}</div>`;
      } else if (type === 'hint') {
        wrapper.className = 'flex justify-center';
        wrapper.innerHTML = `<div class="bg-yellow-900/40 text-yellow-200 border border-yellow-800 rounded-lg px-4 py-2 text-sm max-w-2xl"><span class="mr-1">&#128161;</span>${escapeHtml(content)}</div>`;
      } else if (type === 'status' && extra) {
        wrapper.className = 'flex justify-center';
        wrapper.innerHTML = `<div class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 text-sm max-w-3xl w-full">${renderStatusTable(extra)}</div>`;
      } else if (type === 'export') {
        const fmt = (extra && extra.export_format) || 'json';
        wrapper.className = 'flex justify-center';
        wrapper.innerHTML = `
          <div class="bg-gray-800 border border-cyan-800 rounded-lg px-4 py-3 text-sm max-w-3xl w-full">
            <div class="text-cyan-400 font-semibold mb-2">Export (${fmt.toUpperCase()})</div>
            <pre class="bg-gray-900 rounded p-3 overflow-x-auto text-xs text-gray-300">${escapeHtml(content)}</pre>
          </div>
        `;
      } else if (type === 'notes') {
        wrapper.className = 'flex justify-center';
        const noteContent = content ? escapeHtml(content) : '<span class="text-gray-500">No notes saved for this lesson yet.</span>';
        wrapper.innerHTML = `<div class="bg-purple-900/30 text-purple-200 border border-purple-800 rounded-lg px-4 py-3 text-sm max-w-2xl"><div class="font-semibold mb-1">Notes</div>${noteContent}</div>`;
      } else if (type === 'help' && extra && extra.commands) {
        wrapper.className = 'flex justify-center';
        let rows = extra.commands.map(c => `<tr><td class="text-cyan-400 pr-4 py-1 font-mono">${escapeHtml(c.command)}</td><td class="py-1 text-gray-300">${escapeHtml(c.description)}</td></tr>`).join('');
        wrapper.innerHTML = `
          <div class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 text-sm max-w-2xl">
            <div class="font-semibold mb-2 text-blue-400">Available Commands</div>
            <table class="w-full">${rows}</table>
          </div>
        `;
      } else {
        wrapper.className = 'flex justify-center';
        wrapper.innerHTML = `<div class="bg-gray-700 rounded-lg px-4 py-2 text-sm max-w-2xl">${escapeHtml(content)}</div>`;
      }

      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderStatusTable(data) {
      if (!data.status_table) return '';
      const icons = { not_started: '&#9675;', in_progress: '&#9684;', validated: '&#9681;', completed: '&#9679;' };
      const colors = { not_started: 'text-gray-500', in_progress: 'text-yellow-400', validated: 'text-blue-400', completed: 'text-green-400' };

      let html = '<table class="w-full"><thead><tr><th class="text-left text-cyan-400 pb-2">Module</th><th class="text-left text-cyan-400 pb-2">Lesson</th><th class="text-center text-cyan-400 pb-2">Status</th></tr></thead><tbody>';
      for (const row of data.status_table) {
        const isCurrent = row.module_id === data.current_module && row.lesson_id === data.current_lesson;
        const marker = isCurrent ? ' <span class="text-yellow-400">&#9664;</span>' : '';
        const color = colors[row.status] || 'text-gray-500';
        html += `<tr><td class="py-1 pr-3">${escapeHtml(row.module_title)}</td><td class="py-1 pr-3">${escapeHtml(row.lesson_title)}${marker}</td><td class="py-1 text-center ${color}">${icons[row.status] || row.status}</td></tr>`;
      }
      html += '</tbody></table>';

      if (data.stats) {
        const pct = data.stats.percent_complete || data.stats.completion_percentage || 0;
        const total = data.stats.total_lessons || 0;
        const done = data.stats.completed || data.stats.completed_lessons || 0;
        html += `<div class="mt-3 pt-3 border-t border-gray-600"><div class="flex justify-between text-xs mb-1"><span>Progress</span><span>${Math.round(pct)}%</span></div><div class="w-full bg-gray-700 rounded-full h-1.5"><div class="bg-green-500 h-1.5 rounded-full" style="width:${pct}%"></div></div><div class="text-xs text-gray-500 mt-1">${done}/${total} lessons</div></div>`;
      }
      return html;
    }

    function addTypingIndicator() {
      const el = document.createElement('div');
      el.id = 'typing-indicator';
      el.className = 'flex gap-3';
      el.innerHTML = `
        <div class="shrink-0 w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-sm font-bold">R</div>
        <div class="bg-gray-800 rounded-xl rounded-tl-sm px-4 py-3 flex gap-1 items-center">
          <div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
          <div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
          <div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
        </div>
      `;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    // ---------- Sidebar ----------
    function updateSidebar(progress) {
      if (!progress) return;

      const stats = progress.stats || {};
      const pct = stats.percent_complete || stats.completion_percentage || 0;
      const total = stats.total_lessons || 0;
      const done = stats.completed || stats.completed_lessons || 0;

      progressPct.textContent = `${Math.round(pct)}%`;
      progressBar.style.width = `${pct}%`;
      progressDetail.textContent = `${done} / ${total} lessons`;
    }

    function renderCurriculumTree(modules, currentModule, currentLesson) {
      curriculumTree.innerHTML = '';
      if (!modules) return;

      for (const mod of modules) {
        const modEl = document.createElement('div');
        modEl.innerHTML = `<div class="font-medium text-gray-300 mb-1">${escapeHtml(mod.title)}</div>`;
        const lessonList = document.createElement('ul');
        lessonList.className = 'ml-3 space-y-0.5';

        for (const les of mod.lessons) {
          const isCurrent = mod.id === currentModule && les.id === currentLesson;
          const li = document.createElement('li');
          li.className = `flex items-center gap-2 py-0.5 ${isCurrent ? 'text-yellow-300 font-medium' : 'text-gray-400'}`;
          li.innerHTML = `<span class="status-dot status-${les.status}"></span>${escapeHtml(les.title)}${isCurrent ? ' <span class="text-xs text-yellow-500">&#9664;</span>' : ''}`;
          lessonList.appendChild(li);
        }
        modEl.appendChild(lessonList);
        curriculumTree.appendChild(modEl);
      }
    }

    async function refreshSidebar() {
      if (!sessionId) return;
      try {
        const [statusRes, currRes] = await Promise.all([
          fetch(`/api/status/${sessionId}`),
          fetch(`/api/curriculum/${sessionId}`),
        ]);
        const progress = await statusRes.json();
        const curriculum = await currRes.json();

        updateSidebar({ stats: progress.stats });
        renderCurriculumTree(curriculum, progress.current_module, progress.current_lesson);
      } catch (e) {
        // Sidebar refresh failure is non-critical
      }
    }

    // ---------- Session start ----------
    async function startSession() {
      const name = nameInput.value.trim();
      if (!name) {
        loginError.textContent = 'Please enter your name.';
        loginError.classList.remove('hidden');
        return;
      }

      startBtn.disabled = true;
      startBtn.textContent = 'Starting...';
      loginError.classList.add('hidden');

      try {
        const res = await fetch('/api/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Failed to create session');
        }

        const data = await res.json();
        sessionId = data.session_id;
        studentLabel.textContent = data.student_name;
        localStorage.setItem('bcbot_name', name);

        // Switch screens
        loginScreen.classList.add('hidden');
        chatScreen.classList.remove('hidden');

        // Show greeting
        if (data.greeting) {
          handleResponse(data.greeting);
        }

        // Update sidebar
        if (data.progress) {
          updateSidebar(data.progress);
        }
        refreshSidebar();

        chatInput.focus();
      } catch (e) {
        loginError.textContent = e.message;
        loginError.classList.remove('hidden');
      } finally {
        startBtn.disabled = false;
        startBtn.textContent = 'Start Learning';
      }
    }

    // ---------- Chat ----------
    function handleResponse(resp) {
      const type = resp.type;

      if (type === 'status') {
        addMessage('status', resp.content, resp);
      } else if (type === 'help') {
        addMessage('help', resp.content, resp);
      } else if (type === 'export') {
        addMessage('export', resp.content, resp);
      } else {
        addMessage(type, resp.content, resp);
      }

      // Update sidebar from progress data
      if (resp.progress) {
        updateSidebar(resp.progress);
        if (resp.progress.status_table) {
          renderCurriculumTree(
            groupToModules(resp.progress.status_table),
            resp.progress.current_module,
            resp.progress.current_lesson
          );
        }
      }
    }

    function groupToModules(statusTable) {
      // Group flat status_table back into module/lesson tree
      const map = new Map();
      for (const row of statusTable) {
        if (!map.has(row.module_id)) {
          map.set(row.module_id, { id: row.module_id, title: row.module_title, lessons: [] });
        }
        map.get(row.module_id).lessons.push({
          id: row.lesson_id,
          title: row.lesson_title,
          status: row.status,
        });
      }
      return Array.from(map.values());
    }

    async function sendMessage(message) {
      if (!message.trim() || !sessionId) return;

      // Show user message
      addMessage('user', message);
      chatInput.value = '';
      sendBtn.disabled = true;
      chatInput.disabled = true;

      addTypingIndicator();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message }),
        });

        removeTypingIndicator();

        if (!res.ok) {
          const err = await res.json();
          addMessage('error', err.detail || 'Request failed');
          return;
        }

        const data = await res.json();
        handleResponse(data);

        // Quit handling
        if (data.type === 'quit') {
          chatInput.disabled = true;
          sendBtn.disabled = true;
          return;
        }
      } catch (e) {
        removeTypingIndicator();
        addMessage('error', 'Network error: ' + e.message);
      } finally {
        sendBtn.disabled = false;
        chatInput.disabled = false;
        chatInput.focus();
      }
    }

    // ---------- Command palette ----------
    const COMMANDS = [
      { command: '/help', description: 'Show available commands' },
      { command: '/status', description: 'View your learning progress' },
      { command: '/hint', description: 'Get a hint for the current exercise' },
      { command: '/skip', description: 'Skip the current lesson' },
      { command: '/back', description: 'Go back to the previous lesson' },
      { command: '/reset', description: 'Restart the current lesson' },
      { command: '/notes', description: 'View or save notes for the current lesson' },
      { command: '/export', description: 'Export your learning progress' },
      { command: '/quit', description: 'End the session' },
    ];

    const commandPalette = document.getElementById('command-palette');
    let paletteIndex = -1;

    function showPalette(filtered) {
      if (!filtered.length) { hidePalette(); return; }
      paletteIndex = 0;
      commandPalette.innerHTML = filtered.map((c, i) =>
        `<div class="cmd-item${i === 0 ? ' active' : ''}" data-cmd="${c.command}">` +
        `<span class="cmd-name">${escapeHtml(c.command)}</span>` +
        `<span class="cmd-desc">${escapeHtml(c.description)}</span></div>`
      ).join('');
      commandPalette.classList.remove('hidden');
    }

    function hidePalette() {
      commandPalette.classList.add('hidden');
      commandPalette.innerHTML = '';
      paletteIndex = -1;
    }

    function isPaletteOpen() {
      return !commandPalette.classList.contains('hidden');
    }

    function selectPaletteItem() {
      const items = commandPalette.querySelectorAll('.cmd-item');
      if (paletteIndex >= 0 && paletteIndex < items.length) {
        chatInput.value = items[paletteIndex].dataset.cmd + ' ';
        hidePalette();
        chatInput.focus();
      }
    }

    chatInput.addEventListener('input', () => {
      const val = chatInput.value;
      if (val.startsWith('/')) {
        const prefix = val.split(' ')[0].toLowerCase();
        const filtered = COMMANDS.filter(c => c.command.startsWith(prefix));
        showPalette(filtered);
      } else {
        hidePalette();
      }
    });

    chatInput.addEventListener('keydown', (e) => {
      if (!isPaletteOpen()) return;
      const items = commandPalette.querySelectorAll('.cmd-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        paletteIndex = Math.min(paletteIndex + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('active', i === paletteIndex));
        items[paletteIndex].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        paletteIndex = Math.max(paletteIndex - 1, 0);
        items.forEach((el, i) => el.classList.toggle('active', i === paletteIndex));
        items[paletteIndex].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        selectPaletteItem();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        hidePalette();
      }
    });

    commandPalette.addEventListener('mousedown', (e) => {
      const item = e.target.closest('.cmd-item');
      if (item) {
        e.preventDefault();
        chatInput.value = item.dataset.cmd + ' ';
        hidePalette();
        chatInput.focus();
      }
    });

    document.addEventListener('click', (e) => {
      if (!commandPalette.contains(e.target) && e.target !== chatInput) {
        hidePalette();
      }
    });

    // ---------- Event listeners ----------
    startBtn.addEventListener('click', startSession);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startSession();
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage(chatInput.value);
    });

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('hidden');
      sidebar.classList.toggle('flex');
      // On mobile, overlay the sidebar
      if (!sidebar.classList.contains('hidden')) {
        sidebar.classList.add('absolute', 'inset-y-0', 'left-0', 'z-50', 'lg:relative');
      } else {
        sidebar.classList.remove('absolute', 'inset-y-0', 'left-0', 'z-50', 'lg:relative');
      }
    });

    // ---------- Restore saved name ----------
    const savedName = localStorage.getItem('bcbot_name');
    if (savedName) nameInput.value = savedName;
  </script>
</body>
</html>
